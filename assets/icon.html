<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* rendered locally to icon-512.png — never served under the CSP */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0F4C5C; }
  body { display: grid; place-items: center; }
  /* 12% safe padding each side -> mark fills the middle 76vmin (maskable-safe) */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- the E-to-F dial reduced to arc + needle on teal -->
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M8 44 A24 24 0 0 1 56 44" fill="none" stroke="#F2E9D8" stroke-width="6" stroke-linecap="round"/>
    <line x1="8"  y1="44" x2="8"  y2="37" stroke="#F2E9D8" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="32" y1="20" x2="32" y2="27" stroke="#F2E9D8" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="56" y1="44" x2="56" y2="37" stroke="#F2E9D8" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="32" y1="44" x2="50" y2="31" stroke="#E0B26E" stroke-width="5.4" stroke-linecap="round"/>
    <circle cx="32" cy="44" r="5" fill="#E0B26E"/>
    <circle cx="32" cy="44" r="2" fill="#0F4C5C"/>
  </svg>
</body>
</html>
